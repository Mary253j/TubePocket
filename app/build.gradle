plugins { id 'com.android.application' }

android {
    namespace 'app.tubepocket'
    compileSdk 35
    defaultConfig {
        applicationId 'app.tubepocket'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BUNDLED_ENGINE', '"2026.10.26"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            // Preserve the existing personal test installation's signature; private key is not shipped.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    packaging {
        jniLibs { useLegacyPackaging = true }
        resources { excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
    }
    lint { abortOnError true }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core:1.15.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
